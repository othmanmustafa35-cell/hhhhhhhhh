 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرواد - المشروبات الساخنة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fceecb;
            --card-bg: #ffffff;
            --text-dark: #3a4a58;
            --text-muted: #7d8b96;
            --accent-blue: #6b8ea7;
            --accent-light: #e3ebf0;
            --shadow: 0 8px 20px rgba(0,0,0,0.06);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 40px;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #f7e3b5 0%, #fceecb 100%);
            padding: 25px 20px 15px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            width: 75px;
            height: 75px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            font-size: 35px;
        }

        h1 {
            color: var(--accent-blue);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 12px;
        }

        .item-count-badge {
            background: var(--accent-blue);
            color: white;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .search-box {
            position: relative;
            max-width: 450px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #ecd8ab;
            border-radius: 25px;
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(107, 142, 167, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-blue);
            font-size: 1.1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .section-title {
            color: var(--accent-blue);
            font-size: 1.3rem;
            font-weight: 800;
            text-align: center;
            margin: 10px 0 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title::before, .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: rgba(107, 142, 167, 0.25);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px 8px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-img-wrap {
            width: 100%;
            height: 95px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            background: #f9f9f9;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            line-height: 1.2;
            height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .price-badge {
            background: var(--accent-light);
            color: var(--accent-blue);
            font-weight: 800;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .banner-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-top: 25px;
            box-shadow: var(--shadow);
            border: 2px dashed var(--accent-blue);
        }

        .banner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .banner-title {
            color: var(--accent-blue);
            font-weight: 800;
            font-size: 1.05rem;
        }

        .banner-price {
            background: var(--accent-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .banner-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #eee;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .modal-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-blue);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">☕</div>
        <h1>الرواد - المشروبات الساخنة</h1>
        <p class="subtitle">Coffee Classics & Hot Drinks</p>
        <div class="item-count-badge">المشروبات الساخنة: 17 صنفاً</div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="ابحث عن مشروب ساخن..." onkeyup="searchMenu()">
        </div>
    </header>

    <div class="container">
        <div class="section-title">COFFEE CLASSICS</div>
        <div class="grid" id="gridContainer">
            <!-- Items rendered by JS -->
        </div>

        <div class="banner-card">
            <div class="banner-header">
                <div class="banner-title">Add-Ons (الإضافات) ☕</div>
                <div class="banner-price">0.75 JD</div>
            </div>
            <div class="banner-desc">Extra Shot, Extra Milk, Alternative Milk, Flavor, Honey, Whipped Cream</div>
        </div>
    </div>

    <div class="modal" id="itemModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img src="" id="modalImg" class="modal-img" alt="">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalPrice" class="modal-price"></div>
        </div>
    </div>

    <footer>
        <p>© الرواد آيس كريم وكافيه - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const hotDrinks = [
            { id: 1, title: 'Espresso', price: '2.00 JD', img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400&auto=format&fit=crop' },
            { id: 2, title: 'Americano', price: '2.00 JD', img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400&auto=format&fit=crop' },
            { id: 3, title: 'Red Eye', price: '2.50 JD', img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&auto=format&fit=crop' },
            { id: 4, title: 'Cortado', price: '2.50 JD', img: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=400&auto=format&fit=crop' },
            { id: 5, title: 'Cappuccino', price: '3.00 JD', img: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=400&auto=format&fit=crop' },
            { id: 6, title: 'White Mocha', price: '3.25 JD', img: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=400&auto=format&fit=crop' },
            { id: 7, title: 'Caramel Macchiato', price: '3.50 JD', img: 'https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=400&auto=format&fit=crop' },
            { id: 8, title: 'Spanish Latte', price: '3.50 JD', img: 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=400&auto=format&fit=crop' },
            { id: 9, title: 'Hot Chocolate', price: '3.25 JD', img: 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?w=400&auto=format&fit=crop' },
            { id: 10, title: 'Tea', price: '2.00 JD', img: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400&auto=format&fit=crop' },
            { id: 11, title: 'Espresso Macchiato', price: '2.50 JD', img: 'https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=400&auto=format&fit=crop' },
            { id: 12, title: 'Dark Mocha', price: '3.25 JD', img: 'https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=400&auto=format&fit=crop' },
            { id: 13, title: 'Herbal Tea', price: '2.00 JD', img: 'https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=400&auto=format&fit=crop' },
            { id: 14, title: 'Caffe Latte', price: '3.00 JD', img: 'https://images.unsplash.com/photo-1534778101976-62847782c213?w=400&auto=format&fit=crop' },
            { id: 15, title: 'Coffee Day', price: '1.50 JD', img: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&auto=format&fit=crop' },
            { id: 16, title: 'Turkish Coffee', price: '2.00 JD', img: 'https://images.unsplash.com/photo-1588612165039-3f0f74519969?w=400&auto=format&fit=crop' },
            { id: 17, title: 'Flat White', price: '2.75 JD', img: 'https://images.unsplash.com/photo-1577968897966-3d4325b36b61?w=400&auto=format&fit=crop' }
        ];

        function renderItems(items) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item.title, item.price, item.img);
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${item.img}" alt="${item.title}">
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="price-badge">${item.price}</div>
                `;
                container.appendChild(card);
            });
        }

        function searchMenu() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = hotDrinks.filter(i => i.title.toLowerCase().includes(q));
            renderItems(filtered);
        }

        function openModal(title, price, img) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalImg').src = img;
            document.getElementById('itemModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.remove('active');
        }

        renderItems(hotDrinks);
    </script>
</body>
</html>
